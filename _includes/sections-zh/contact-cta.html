<section class="section section--tint">
  <div class="container container--narrow">
    <div class="contact-cta">
      <span class="eyebrow eyebrow--brand">07 ／ 與我們對話</span>
      <h2 class="contact-cta__title">讓我們講好您的故事。</h2>
      <p class="contact-cta__sub">
        告訴我們您正在打造什麼。我們將於一個工作天內回覆 —— 附上為您量身撰寫的方案，而非通用簡報。
      </p>
      <div class="contact-cta__ctas">
        <a class="btn btn--primary" href="{{ '/contact/' | relative_url }}">展開對話</a>
        {% if site.data.contact.email %}<a class="btn btn--ghost" href="mailto:{{ site.data.contact.email }}">{{ site.data.contact.email }}</a>{% endif %}
      </div>
    </div>
  </div>
</section>
