<div class="lang-switcher" role="group" aria-label="Language">
  {% assign current_lang = page.lang | default: 'en' %}
  {% for l in site.data.languages %}
    <a href="{{ l.url | relative_url }}"
       class="lang-switcher__item{% if l.code == current_lang %} active{% endif %}"
       lang="{{ l.code }}"
       title="{{ l.full }}">{{ l.label }}</a>
  {% endfor %}
</div>
