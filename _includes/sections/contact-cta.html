<section class="section section--tint">
  <div class="container container--narrow">
    <div class="contact-cta">
      <span class="eyebrow eyebrow--brand">07 / Let&rsquo;s talk</span>
      <h2 class="contact-cta__title">Let&rsquo;s tell your story.</h2>
      <p class="contact-cta__sub">
        Tell us what you&rsquo;re building. We&rsquo;ll get back within one business day with a tailored plan &mdash; no generic decks.
      </p>
      <div class="contact-cta__ctas">
        <a class="btn btn--primary" href="{{ '/contact/' | relative_url }}">Start a conversation</a>
        {% if site.data.contact.email %}<a class="btn btn--ghost" href="mailto:{{ site.data.contact.email }}">{{ site.data.contact.email }}</a>{% endif %}
      </div>
    </div>
  </div>
</section>
