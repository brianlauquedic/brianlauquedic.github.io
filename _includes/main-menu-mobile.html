<nav class="mobile-menu" id="mobile-menu" aria-label="Mobile">
  {% assign mainmenu = site.data.menus.main | sort: 'weight' %}
  <ul>
    {% for item in mainmenu %}
    <li class="{% if item.url == page.url %}active{% endif %}">
      <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
    </li>
    {% endfor %}
  </ul>

  {% assign current_lang = page.lang | default: 'en' %}
  <div class="mobile-menu__lang" role="group" aria-label="Language">
    {% for l in site.data.languages %}
      <a href="{{ l.url | relative_url }}"
         class="{% if l.code == current_lang %}active{% endif %}"
         lang="{{ l.code }}">{{ l.full }}</a>
    {% endfor %}
  </div>
</nav>
