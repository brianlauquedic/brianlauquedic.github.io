<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
      <img src="{{ site.logo.desktop | relative_url }}" alt="{{ site.title }}" />
    </a>
    <a class="site-header__logo-mobile" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
      <img src="{{ site.logo.mobile | relative_url }}" alt="{{ site.title }}" />
    </a>
    {% include main-menu.html %}
    {% include lang-switcher.html %}
    {% include hamburger.html %}
  </div>
</header>
