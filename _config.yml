baseurl: '/'
permalink: pretty
title: 'Quedic'
description: 'Integrated PR, marketing & KOL for Web3 exchanges and protocols.'

logo:
  mobile: "images/logo/logo-mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo.svg"
  desktop_height: "32px"
  desktop_width: "120px"

collections:
  services:
    output: true
    sort_by: weight
    permalink: /services/:path/
  industries:
    output: true
    sort_by: weight
    permalink: /industries/:path/

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "industries"
    values:
      layout: "industry"

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - run.sh
