# =====================================================================
# Quedic Shop — package catalog & on-chain payment configuration
#
# Prices are USDT (= USDC = USD-equivalent on BNB Smart Chain).
# Source: internal pricing sheets, normalized into customer-facing bundles.
# Long-tail SKUs (per-item KOL slots, single platform listings, social
# growth numbers, etc.) are not displayed here — those go through the
# "custom quote" CTA at the bottom of the shop page.
# =====================================================================

# ⚠️ MUST be set to a real BSC wallet you control before launch.
receiving_wallet: "0x0000000000000000000000000000000000000000"

# Reuse the same Formspree project as the contact form.
formspree_endpoint: "https://formspree.io/f/your-id"

# Target chain — BNB Smart Chain mainnet
chain:
  id: 56
  hex: "0x38"
  name: "BNB Smart Chain"
  rpc: "https://bsc-dataseed.binance.org"
  block_explorer: "https://bscscan.com"
  native_symbol: "BNB"

# ERC-20 token contracts on BSC (both 18 decimals)
