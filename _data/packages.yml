# =====================================================================
# Quedic Shop — package catalog & on-chain payment configuration
#
# IMPORTANT: replace `receiving_wallet` and the Formspree endpoint with
# real values before going live. Prices are placeholders — adjust freely.
# =====================================================================

# Address that receives client payments. ⚠️ MUST be set to a real BSC
# wallet you control before launch. Currently a zero address as a guard.
receiving_wallet: "0x0000000000000000000000000000000000000000"

# Endpoint that receives the order email. Reuses the same Formspree
# project as the contact form for a single inbox.
formspree_endpoint: "https://formspree.io/f/your-id"

# Target chain — BNB Smart Chain mainnet
chain:
  id: 56
  hex: "0x38"
  name: "BNB Smart Chain"
  rpc: "https://bsc-dataseed.binance.org"
  block_explorer: "https://bscscan.com"
  native_symbol: "BNB"

# ERC-20 token contracts on BSC (both 18 decimals on this chain)
tokens:
  USDT:
    address: "0x55d398326f99059fF775485246999027B3197955"
    decimals: 18
    symbol: "USDT"
  USDC:
    address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"
    decimals: 18
    symbol: "USDC"

# =====================================================================
# Packages
# Each package has trilingual title / summary / bullets, a price in
# USDT and USDC (same number normally), and an optional `recurring`
# flag for monthly retainers.
# =====================================================================
