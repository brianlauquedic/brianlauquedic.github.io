# =====================================================================
# Quedic Shop — package catalog & on-chain payment configuration
#
# Currency: USDT (= USDC = USD-equivalent on BNB Smart Chain).
# Pricing source: 对外价格 column from internal pricing sheets.
# Bundle math: each bundle is honestly cheaper than its component sum.
#   `original_usdt` shown alongside `price_usdt` so customers see the
#   savings (strikethrough display in the UI).
# =====================================================================

# BSC wallet that receives USDT/USDC from on-chain orders.
receiving_wallet: "0xa1d1eaffafda03fa1c30091e34655edea50d3bde"

# Cloudflare Worker (cloudflare-worker/index.js, see SETUP.md). The
# Worker holds the Telegram bot token as an encrypted env var and
# forwards each order as a Markdown message to the internal Quedic
# Telegram group. Browser sees only this Worker URL — bot token
# never reaches the client.
order_endpoint: "https://quedic-orders.thatbrianlau.workers.dev"

chain:
  id: 56
  hex: "0x38"
  name: "BNB Smart Chain"
  rpc: "https://bsc-dataseed.binance.org"
  block_explorer: "https://bscscan.com"
  native_symbol: "BNB"

tokens:
  USDT:
    address: "0x55d398326f99059fF775485246999027B3197955"
    decimals: 18
    symbol: "USDT"
  USDC:
    address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"
    decimals: 18
    symbol: "USDC"

# =====================================================================
# Filter categories shown as chips above the grid
# =====================================================================
categories:
  - id: all
    label:
      en: "All"
      zh-tw: "全部"
      ja: "すべて"
  - id: listings
    label:
      en: "Listings"
      zh-tw: "收錄"
      ja: "掲載"
  - id: pr
    label:
      en: "PR"
      zh-tw: "公關"
      ja: "PR"
  - id: kol
    label:
      en: "KOL"
      zh-tw: "KOL"
      ja: "KOL"
  - id: live
    label:
      en: "Live"
      zh-tw: "直播"
      ja: "ライブ"
  # Single "Programs" chip rolls up Brand sprint, Launch bundles, and
  # Retainer — each was too thin on its own (1–2 cards). JS filter
  # handler treats `programs` as a virtual id matching brand|launch|
  # retainer cards. Card data still tagged with original category.
  - id: programs
    matches: ["brand", "launch", "retainer"]
    label:
      en: "Programs"
      zh-tw: "綜合計劃"
      ja: "プログラム"

